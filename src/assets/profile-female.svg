<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" role="img" aria-labelledby="title desc">
  <title id="title">Professional female profile avatar</title>
  <desc id="desc">A stylized female office worker portrait with a blazer and clean background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#edf4ff"/>
      <stop offset="100%" stop-color="#dfe8ff"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#6d7eff"/>
      <stop offset="100%" stop-color="#4a5ce7"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf3ff"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd9c5"/>
      <stop offset="100%" stop-color="#f2b59a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#272b48"/>
      <stop offset="100%" stop-color="#161b2b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#7d93d6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="700" height="760" fill="url(#bg)"/>
  <circle cx="360" cy="130" r="160" fill="#edf4ff" opacity="0.7"/>

