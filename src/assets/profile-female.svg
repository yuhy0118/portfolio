    <path d="M320 566L360 695L400 566L418 760H302L320 566Z" fill="#f8fbff"/>

    <path d="M258 300C258 212 304 156 360 156C416 156 462 212 462 300V334C462 434 421 495 360 495C299 495 258 434 258 334V300Z" fill="url(#skin)"/>

    <path d="M262 300C260 216 302 146 360 146C418 146 460 216 458 300C442 252 414 222 360 222C306 222 278 252 262 300Z" fill="url(#hair)"/>
    <path d="M240 292C242 214 290 146 350 136C307 165 280 204 268 255C258 284 247 288 240 292Z" fill="#1a1f30" opacity="0.9"/>
    <path d="M480 292C478 214 430 146 370 136C413 165 440 204 452 255C462 284 473 288 480 292Z" fill="#1a1f30" opacity="0.9"/>

    <circle cx="326" cy="310" r="6" fill="#1f2435"/>
    <circle cx="394" cy="310" r="6" fill="#1f2435"/>
    <path d="M330 354C344 363 376 363 390 354" stroke="#b2715f" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M336 332L360 348L384 332" stroke="#ba775c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <path d="M308 262C328 248 346 242 360 242C374 242 392 248 412 262L398 288H322L308 262Z" fill="#f9d8cc" opacity="0.6"/>
